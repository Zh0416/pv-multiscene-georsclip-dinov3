[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-multiscene-study"
version = "0.1.0"
description = "Registered GeoRSCLIP and DINOv3-SAT photovoltaic segmentation study"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "rasterio>=1.3", "shapely>=2", "pyproj>=3", "torch>=2.1", "open_clip_torch>=2.26"]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.8"]

[project.scripts]
pvstudy = "pvstudy.cli:main"

[tool.setuptools.packages.find]
include = ["pvstudy*"]

[tool.ruff]
line-length = 100
target-version = "py39"
